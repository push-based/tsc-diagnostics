    <rect width="128" height="128" rx="24" fill="url(#tile)"/>
    <rect width="128" height="128" rx="24" fill="url(#glow)"/>
    <rect width="128" height="128" rx="24" fill="url(#shine)"/>
    <rect x=".75" y=".75" width="126.5" height="126.5" rx="23.25" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="1.5"/>
    <path d="M34 36L14 64L34 92M94 36L114 64L94 92" fill="none" stroke="url(#br)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 64H48L55 50L64 84L73 38L80 64H92" fill="none" stroke="#FF4F8B" stroke-opacity=".7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#blur)"/>
    <path d="M36 64H48L55 50L64 84L73 38L80 64H92" fill="none" stroke="url(#pl)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="73" cy="38" r="8" fill="#FF9A3D" opacity=".8" filter="url(#blur)"/>
