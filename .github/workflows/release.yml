name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

# Pushes and GitHub releases use the GitHub App token, not GITHUB_TOKEN
permissions:
  contents: read

jobs:
  release:
    name: Version and release
    runs-on: ubuntu-latest
    # GH_APP_ID and GH_APP_PRIVATE_KEY are stored in this environment.
    environment: release
    steps:
      - name: Authenticate as "PushBased Bot" GitHub App
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Fetch GitHub App's user ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Configure Git user
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Clone the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Bumps package.json from the conventional commits since the last v* tag,
      # updates CHANGELOG.md, commits, tags, pushes and creates the GitHub release.
      - name: Version, release and generate changelog
        run: npx nx release --skip-publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
