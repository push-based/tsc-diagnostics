name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # `build` starts from an empty dist/, so stale or deleted files show up too.
      - run: npm run build

      # dist/ is committed so installing from GitHub works without a build
      # step. Fail if it does not match the sources.
      - name: Check committed dist/ is up to date
        if: runner.os == 'Linux'
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi

      - run: npm test

      - name: Check the package can be published
        if: runner.os == 'Linux' && matrix.node == 22
        run: npm publish --dry-run --ignore-scripts

      - name: Smoke test installing the packed package
        run: |
          npm pack --pack-destination ..
          mkdir ../consumer
          cd ../consumer
          npm init -y > /dev/null
          npm install ../push-based-tsc-diagnostics-*.tgz
          npx tsc-diagnostics --help
          npx ts-diagnostics --help
          npx ts-diagnostics-aggregate --help
          npx ts-diagnostics-compare --help
          node -e "const api = require('@push-based/tsc-diagnostics'); if (typeof api.analyzeProjectReport !== 'function') process.exit(1)"

      - name: Smoke test running the package with npx without installing it
        run: |
          cd ..
          npx --yes ./push-based-tsc-diagnostics-*.tgz --help
