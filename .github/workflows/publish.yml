name: Publish

on:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

# npm trusts this workflow as a trusted publisher (OIDC), so no npm token is stored.
# https://docs.npmjs.com/trusted-publishers
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # The npm trusted publisher names this environment, so a run outside it can't publish.
    environment: release
    defaults:
      run:
        shell: bash
    steps:
      - name: Clone the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # npm trusted publishing needs npm 11.5.1 or later, which Node.js 24 bundles.
          node-version: 24
          cache: npm

      - name: Check npm supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error(`npm ${process.argv[1]} is too old for trusted publishing (needs 11.5.1+).`); process.exit(1); }
          ' "$npm_version"

      # Publishing a commit that the Release workflow did not tag would ship
      # unreleased changes under an old version number.
      - name: Check this commit is the release of its version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if ! git tag --points-at HEAD | grep -qx "$tag"; then
            echo "::error::HEAD is not tagged $tag. Run the Release workflow first, or run Publish on the $tag tag."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # `prepublishOnly` runs `npm test`, which rebuilds dist/ from the sources
      # and runs the test suite before anything is uploaded.
      - name: Publish to npm
        run: npx nx release publish
