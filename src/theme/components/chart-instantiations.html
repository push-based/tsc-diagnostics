<style>body { padding: 32px; } #instChart { max-width: 720px; min-height: 430px; }</style>
</head>
<body class="pb-page">
<div id="instChart" class="pb-chart" data-title="Generic/type instantiations"></div>

<script src="../shared-report.js"></script>
<script type="module">
import * as Plot from "https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6.17/+esm";

const rows = [
  { config: "app-shell", instantiations: 612000, total_s: 5.66, check_s: 3.1 },
  { config: "feature-reports", instantiations: 402000, total_s: 4.1, check_s: 2.6 },
  { config: "data-access", instantiations: 318000, total_s: 3.24, check_s: 2.0 },
  { config: "design-system", instantiations: 141000, total_s: 1.7, check_s: 1.1 }
];

function render() {
  const instRows = [...rows].sort((a, b) => b.instantiations - a.instantiations);
  mountPlot("instChart", Plot.plot({
    width: plotWidth("instChart"), height: 360,
    marginLeft: 120, marginRight: 20, marginTop: 12, marginBottom: 56,
    style: { color: "#f8fafc", fontFamily: "Geist, sans-serif", background: "transparent" },
    x: { label: "Instantiations", grid: true, tickFormat: "s" },
    y: { label: null, domain: instRows.map((row) => row.config) },
    marks: [
      Plot.barX(instRows, {
        y: "config", x: "instantiations", fill: "#875bf7",
        tip: {
          ...TIP_STYLE,
          format: { y: true, x: (v) => v.toLocaleString(), total_s: (v) => `${v.toFixed(2)}s`, check_s: (v) => `${v.toFixed(2)}s` }
        }
      }),
      Plot.ruleX([0])
    ]
  }));
}

render();
window.addEventListener("resize", render);
</script>
</body>
</html>
